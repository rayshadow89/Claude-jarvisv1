<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKER — La última carta del mazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --negro:          #0a0708;
    --negro-carta:    #14100f;
    --negro-elevado:  #1d1719;
    --burdeos:        #7d1832;
    --burdeos-claro:  #a8284a;
    --burdeos-vivo:   #c33055;
    --burdeos-oscuro: #4a0d1c;
    --texto:          #f0e7e9;
    --texto-suave:    #a49197;
    --borde:          #2c2225;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--negro);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    /* Resplandor burdeos difuso, como el foco sobre una mesa de juego */
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(125, 24, 50, 0.28), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(125, 24, 50, 0.12), transparent 70%);
    background-attachment: fixed;
  }

  .app {
    width: 100%;
    max-width: 880px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0 20px;
  }

  /* ---------- Cabecera ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 28px 4px 22px;
    border-bottom: 1px solid var(--borde);
  }

  .mascota-caja {
    width: 62px;
    height: 84px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .mascota {
    max-width: 100%;
    max-height: 100%;
    /* La figura es negra sobre fondo oscuro: la teñimos de burdeos e
       invertimos para que destaque sobre el negro del fondo. */
    filter: invert(19%) sepia(64%) saturate(2800%) hue-rotate(325deg) brightness(94%) contrast(96%)
            drop-shadow(0 0 14px rgba(195, 48, 85, 0.45));
  }

  .mascota-fallback {
    display: none;
    font-size: 46px;
    line-height: 1;
    filter: drop-shadow(0 0 14px rgba(195, 48, 85, 0.5));
  }

  .titulos { display: flex; flex-direction: column; gap: 4px; }

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    line-height: 1;
    background: linear-gradient(170deg, #f3dde2 0%, var(--burdeos-vivo) 55%, var(--burdeos) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .slogan {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.92rem;
    font-style: italic;
    letter-spacing: 0.07em;
    color: var(--burdeos-claro);
  }

  .btn-nueva {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--borde);
    color: var(--texto-suave);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .btn-nueva:hover {
    border-color: var(--burdeos);
    color: var(--texto);
    background: rgba(125, 24, 50, 0.14);
  }

  /* ---------- Zona de mensajes ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 26px 4px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--burdeos-oscuro) transparent;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb {
    background: var(--burdeos-oscuro);
    border-radius: 4px;
  }

  .bienvenida {
    margin: auto;
    text-align: center;
    color: var(--texto-suave);
    max-width: 440px;
    line-height: 1.7;
  }
  .bienvenida strong { color: var(--burdeos-claro); font-weight: 600; }
  .ejemplos {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .ejemplo {
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    color: var(--texto-suave);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s ease;
  }
  .ejemplo:hover {
    border-color: var(--burdeos);
    color: var(--texto);
    background: rgba(125, 24, 50, 0.16);
  }

  .msg {
    max-width: 76%;
    padding: 13px 17px;
    border-radius: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: aparecer 0.24s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.usuario {
    align-self: flex-end;
    background: linear-gradient(145deg, var(--burdeos), var(--burdeos-oscuro));
    border: 1px solid rgba(195, 48, 85, 0.4);
    border-bottom-right-radius: 4px;
  }

  .msg.joker {
    align-self: flex-start;
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    border-left: 3px solid var(--burdeos);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: rgba(125, 24, 50, 0.13);
    border: 1px solid var(--burdeos);
    border-left: 3px solid var(--burdeos-vivo);
    color: #f5c9d2;
    font-size: 0.92rem;
  }

  .autor {
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--burdeos-claro);
    margin-bottom: 5px;
  }
  .msg.usuario .autor { color: rgba(255, 255, 255, 0.62); }

  /* Puntitos de "escribiendo..." */
  .pensando { display: flex; gap: 5px; padding: 4px 0; }
  .pensando span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--burdeos-claro);
    animation: latir 1.3s infinite ease-in-out;
  }
  .pensando span:nth-child(2) { animation-delay: 0.18s; }
  .pensando span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes latir {
    0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
    30%           { opacity: 1;    transform: translateY(-5px); }
  }

  /* ---------- Barra de escritura ---------- */
  .barra {
    padding: 16px 0 24px;
    border-top: 1px solid var(--borde);
  }
  .campo {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .campo:focus-within {
    border-color: var(--burdeos);
    box-shadow: 0 0 0 3px rgba(125, 24, 50, 0.2);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--texto);
    font-family: inherit;
    font-size: 0.97rem;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    padding: 5px 0;
  }
  textarea::placeholder { color: #6b585e; }

  .enviar {
    background: linear-gradient(145deg, var(--burdeos-claro), var(--burdeos));
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
  }
  .enviar:hover:not(:disabled) {
    background: linear-gradient(145deg, var(--burdeos-vivo), var(--burdeos-claro));
    transform: translateY(-1px);
  }
  .enviar:disabled { opacity: 0.4; cursor: not-allowed; }
  .enviar svg { width: 18px; height: 18px; fill: currentColor; }

  .pie {
    text-align: center;
    font-size: 0.72rem;
    color: #5d4c51;
    margin-top: 10px;
  }

  @media (max-width: 620px) {
    h1 { font-size: 1.9rem; }
    .slogan { font-size: 0.78rem; }
    .msg { max-width: 88%; }
    .mascota-caja { width: 46px; height: 62px; }
    header { gap: 14px; padding-top: 20px; }
    .btn-nueva { padding: 7px 10px; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="mascota-caja">
      <img src="/static/joker.jpg" alt="" class="mascota" id="mascota"
           onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <div class="mascota-fallback" id="fallback">🃏</div>
    </div>
    <div class="titulos">
      <h1>JOKER</h1>
      <div class="slogan">La última carta del mazo</div>
    </div>
    <button class="btn-nueva" id="btn-nueva" title="Empezar una conversación nueva">
      Nueva partida
    </button>
  </header>

  <div id="chat">
    <div class="bienvenida" id="bienvenida">
      Soy <strong>JOKER</strong>. Puedo decirte la hora y el tiempo de cualquier
      lugar, resolver cálculos y buscar información.
      <div class="ejemplos">
        <button class="ejemplo">¿Qué hora es en Tokio?</button>
        <button class="ejemplo">Cuánto es (45 * 8) / 3</button>
        <button class="ejemplo">Busca información sobre Nikola Tesla</button>
      </div>
    </div>
  </div>

  <div class="barra">
    <div class="campo">
      <textarea id="entrada" rows="1" placeholder="Escribe tu mensaje..." autofocus></textarea>
      <button class="enviar" id="enviar" title="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="pie">Pulsa Enter para enviar &middot; Mayús+Enter para salto de línea</div>
  </div>

</div>

<script>
  const chat       = document.getElementById('chat');
  const entrada    = document.getElementById('entrada');
  const btnEnviar  = document.getElementById('enviar');
  const btnNueva   = document.getElementById('btn-nueva');
  let ocupado = false;

  // La caja de texto crece según escribes
  entrada.addEventListener('input', () => {
    entrada.style.height = 'auto';
    entrada.style.height = Math.min(entrada.scrollHeight, 160) + 'px';
  });

  entrada.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  });

  btnEnviar.addEventListener('click', enviar);

  document.querySelectorAll('.ejemplo').forEach(b => {
    b.addEventListener('click', () => {
      entrada.value = b.textContent.trim();
      enviar();
    });
  });

  btnNueva.addEventListener('click', async () => {
    if (ocupado) return;
    await fetch('/api/nueva', { method: 'POST' });
    chat.innerHTML = '';
    añadirBienvenida();
  });

  function añadirBienvenida() {
    const div = document.createElement('div');
    div.className = 'bienvenida';
    div.innerHTML = 'Soy <strong>JOKER</strong>. Puedo decirte la hora y el tiempo de ' +
                    'cualquier lugar, resolver cálculos y buscar información.';
    chat.appendChild(div);
  }

  // Usamos textContent (no innerHTML) para el texto de los mensajes: así, si
  // alguien escribe algo que parezca HTML, se muestra como texto y no se ejecuta.
  function añadirMensaje(texto, tipo, autor) {
    const bienvenida = document.getElementById('bienvenida');
    if (bienvenida) bienvenida.remove();
    document.querySelectorAll('.bienvenida').forEach(b => b.remove());

    const div = document.createElement('div');
    div.className = 'msg ' + tipo;

    if (autor) {
      const etiqueta = document.createElement('span');
      etiqueta.className = 'autor';
      etiqueta.textContent = autor;
      div.appendChild(etiqueta);
    }

    const cuerpo = document.createElement('span');
    cuerpo.textContent = texto;
    div.appendChild(cuerpo);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function mostrarPensando() {
    const div = document.createElement('div');
    div.className = 'msg joker';
    div.id = 'pensando';
    div.innerHTML = '<span class="autor">JOKER</span>' +
                    '<div class="pensando"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function quitarPensando() {
    const p = document.getElementById('pensando');
    if (p) p.remove();
  }

  async function enviar() {
    const mensaje = entrada.value.trim();
    if (!mensaje || ocupado) return;

    ocupado = true;
    btnEnviar.disabled = true;
    entrada.value = '';
    entrada.style.height = 'auto';

    añadirMensaje(mensaje, 'usuario', 'TÚ');
    mostrarPensando();

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje })
      });
      const datos = await resp.json();
      quitarPensando();

      if (datos.error) {
        añadirMensaje(datos.error, 'error', null);
      } else {
        añadirMensaje(datos.respuesta, 'joker', 'JOKER');
      }
    } catch (e) {
      quitarPensando();
      añadirMensaje('No pude contactar con el servidor. ¿Sigue abierta la ventana ' +
                    'donde ejecutaste "python app.py"?', 'error', null);
    } finally {
      ocupado = false;
      btnEnviar.disabled = false;
      entrada.focus();
    }
  }
</script>
</body>
</html>
