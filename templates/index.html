<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKER — Last Card.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/joker.css">
<style>
  :root {
    --negro:          #0a0708;
    --negro-carta:    #14100f;
    --negro-elevado:  #1d1719;
    --burdeos:        #7d1832;
    --burdeos-claro:  #a8284a;
    --burdeos-vivo:   #c33055;
    --burdeos-oscuro: #4a0d1c;
    --texto:          #f0e7e9;
    --texto-suave:    #a49197;
    --borde:          #2c2225;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--negro);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    /* Resplandor burdeos difuso, como el foco sobre una mesa de juego */
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(125, 24, 50, 0.28), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(125, 24, 50, 0.12), transparent 70%);
    background-attachment: fixed;
  }

  .app {
    width: 100%;
    max-width: 880px;
    position: relative;
    z-index: 1;   /* el chat siempre por delante de los palos decorativos */
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0 20px;
  }

  /* ---------- Cabecera ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 28px 4px 22px;
    border-bottom: 1px solid var(--borde);
  }

  .mascota-caja {
    width: 62px;
    height: 84px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .mascota {
    max-width: 100%;
    max-height: 100%;
    /* La figura es negra sobre fondo oscuro: la teñimos de burdeos e
       invertimos para que destaque sobre el negro del fondo. */
    filter: invert(19%) sepia(64%) saturate(2800%) hue-rotate(325deg) brightness(94%) contrast(96%)
            drop-shadow(0 0 14px rgba(195, 48, 85, 0.45));
  }

  .mascota-fallback {
    display: none;
    font-size: 46px;
    line-height: 1;
    filter: drop-shadow(0 0 14px rgba(195, 48, 85, 0.5));
  }

  .titulos { display: flex; flex-direction: column; gap: 4px; }

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    line-height: 1;
    background: linear-gradient(170deg, #f3dde2 0%, var(--burdeos-vivo) 55%, var(--burdeos) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .slogan {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.92rem;
    font-style: italic;
    letter-spacing: 0.07em;
    color: var(--burdeos-claro);
  }

  .btn-nueva {
    margin-left: auto;
    background: transparent;
    border: 1px solid var(--borde);
    color: var(--texto-suave);
    padding: 8px 14px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .btn-nueva:hover {
    border-color: var(--burdeos);
    color: var(--texto);
    background: rgba(125, 24, 50, 0.14);
  }

  /* ---------- Zona de mensajes ---------- */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 26px 4px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--burdeos-oscuro) transparent;
  }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb {
    background: var(--burdeos-oscuro);
    border-radius: 4px;
  }

  .bienvenida {
    margin: auto;
    text-align: center;
    color: var(--texto-suave);
    max-width: 440px;
    line-height: 1.7;
  }
  .bienvenida strong { color: var(--burdeos-claro); font-weight: 600; }
  .ejemplos {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .ejemplo {
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    color: var(--texto-suave);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 0.82rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.18s ease;
  }
  .ejemplo:hover {
    border-color: var(--burdeos);
    color: var(--texto);
    background: rgba(125, 24, 50, 0.16);
  }

  .msg {
    max-width: 76%;
    padding: 13px 17px;
    border-radius: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: aparecer 0.24s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.usuario {
    align-self: flex-end;
    background: linear-gradient(145deg, var(--burdeos), var(--burdeos-oscuro));
    border: 1px solid rgba(195, 48, 85, 0.4);
    border-bottom-right-radius: 4px;
  }

  .msg.joker {
    align-self: flex-start;
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    border-left: 3px solid var(--burdeos);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: rgba(125, 24, 50, 0.13);
    border: 1px solid var(--burdeos);
    border-left: 3px solid var(--burdeos-vivo);
    color: #f5c9d2;
    font-size: 0.92rem;
  }

  .autor {
    display: block;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--burdeos-claro);
    margin-bottom: 5px;
  }
  .msg.usuario .autor { color: rgba(255, 255, 255, 0.62); }

  /* Puntitos de "escribiendo..." */
  .pensando { display: flex; gap: 5px; padding: 4px 0; }
  .pensando span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--burdeos-claro);
    animation: latir 1.3s infinite ease-in-out;
  }
  .pensando span:nth-child(2) { animation-delay: 0.18s; }
  .pensando span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes latir {
    0%, 60%, 100% { opacity: 0.28; transform: translateY(0); }
    30%           { opacity: 1;    transform: translateY(-5px); }
  }
  /* Con menos movimiento, los puntitos se quedan quietos y visibles: la regla
     general solo acorta duraciones, y acortar un latido infinito lo convierte
     en un parpadeo, que es justo lo que se quería evitar. */
  @media (prefers-reduced-motion: reduce) {
    .pensando span { animation: none !important; opacity: 0.75; }
  }

  /* ---------- Barra de escritura ---------- */
  .barra {
    padding: 16px 0 24px;
    border-top: 1px solid var(--borde);
  }
  .campo {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 10px 10px 10px 16px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }
  .campo:focus-within {
    border-color: var(--burdeos);
    box-shadow: 0 0 0 3px rgba(125, 24, 50, 0.2);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--texto);
    font-family: inherit;
    font-size: 0.97rem;
    line-height: 1.5;
    resize: none;
    max-height: 160px;
    padding: 5px 0;
  }
  textarea::placeholder { color: #6b585e; }

  .enviar {
    background: linear-gradient(145deg, var(--burdeos-claro), var(--burdeos));
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
  }
  .enviar:hover:not(:disabled) {
    background: linear-gradient(145deg, var(--burdeos-vivo), var(--burdeos-claro));
    transform: translateY(-1px);
  }
  .enviar:disabled { opacity: 0.4; cursor: not-allowed; }
  .enviar svg { width: 18px; height: 18px; fill: currentColor; }

  .acciones-cabecera {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .acciones-cabecera .salas { margin-left: 0; }

  /* ---------- El micrófono ---------- */
  /* Todavía no graba. Se ve apagado a propósito: un botón que promete algo
     que no hace es peor que no tenerlo, así que este dice desde el aspecto
     que aún no le toca. */
  .microfono {
    background: var(--negro-elevado);
    border: 1px solid var(--borde);
    color: var(--texto-suave);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s ease;
    position: relative;
  }
  .microfono svg { width: 18px; height: 18px; fill: currentColor; }
  .microfono:hover { border-color: var(--burdeos); color: var(--texto);
    background: rgba(125, 24, 50, 0.16); }
  .microfono:active { transform: translateY(1px) scale(0.97); }

  /* Al pulsarlo late un momento, para que se note que ha recibido el toque
     aunque lo que conteste sea "todavía no". */
  .microfono.intentando { animation: mic-late 0.5s ease; }
  @keyframes mic-late {
    0%, 100% { box-shadow: 0 0 0 0 rgba(195, 48, 85, 0); }
    45%      { box-shadow: 0 0 0 7px rgba(195, 48, 85, 0.22); }
  }

  .microfono .globito-mic {
    position: absolute; bottom: 52px; right: -4px;
    background: var(--negro-elevado); border: 1px solid var(--burdeos);
    color: var(--texto); font-size: 0.74rem; line-height: 1.45;
    padding: 8px 12px; border-radius: 9px; width: 214px; text-align: left;
    opacity: 0; pointer-events: none; transform: translateY(5px);
    transition: opacity .2s ease, transform .2s ease;
    z-index: 6;
  }
  .microfono.avisando .globito-mic { opacity: 1; transform: translateY(0); }

  /* Escuchando: el botón se enciende y late, para que no haya duda de que el
     micro está abierto. Un micrófono que graba sin avisar es de mala educación. */
  .microfono.escuchando {
    background: linear-gradient(145deg, var(--burdeos-claro), var(--burdeos));
    border-color: transparent; color: #fff;
  }
  .microfono.escuchando::after {
    content: ''; position: absolute; inset: -1px; border-radius: 10px;
    border: 2px solid var(--burdeos-vivo);
    animation: latido-mic 1.4s ease-out infinite;
  }
  @keyframes latido-mic {
    0%   { transform: scale(1);    opacity: 0.9; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .microfono.no-puede { opacity: 0.45; cursor: not-allowed; }

  /* ---------- El botón de voz ---------- */
  .voz {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--negro-carta); border: 1px solid var(--borde);
    color: var(--texto-suave); font-family: inherit; font-size: 0.75rem;
    padding: 6px 12px; border-radius: 18px; cursor: pointer;
    transition: all 0.18s ease; margin-right: 6px;
  }
  .voz:hover { border-color: var(--burdeos); color: var(--texto); }
  .voz .icono-voz { width: 14px; height: 14px; fill: currentColor; }
  /* Apagado, el altavoz no tiene ondas: se ve de un vistazo que está en silencio */
  .voz[aria-pressed="false"] .onda1,
  .voz[aria-pressed="false"] .onda2 { opacity: 0; }
  .voz[aria-pressed="true"] {
    background: linear-gradient(145deg, var(--burdeos), var(--burdeos-oscuro));
    border-color: var(--burdeos-claro); color: #fff;
  }
  .voz.hablando .onda2 { animation: onda 1.1s ease-in-out infinite; }
  @keyframes onda {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  .voz.no-puede { display: none; }

  .pie {
    text-align: center;
    font-size: 0.72rem;
    color: #5d4c51;
    margin-top: 10px;
  }

  /* ---------- Selector de potencia ---------- */
  .potencia {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .potencia-titulo {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 0.64rem;
    letter-spacing: 0.16em;
    color: var(--texto-suave);
    text-transform: uppercase;
  }

  .potencia-opciones {
    display: flex;
    gap: 4px;
    background: var(--negro-carta);
    border: 1px solid var(--borde);
    border-radius: 20px;
    padding: 3px;
  }

  .nivel {
    background: transparent;
    border: none;
    color: var(--texto-suave);
    font-family: inherit;
    font-size: 0.74rem;
    letter-spacing: 0.02em;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
    white-space: nowrap;
  }
  .nivel:hover { color: var(--texto); }

  .nivel[aria-pressed="true"] {
    background: linear-gradient(145deg, var(--burdeos), var(--burdeos-oscuro));
    color: #fff;
  }

  /* El último nivel tiene su propia personalidad */
  .nivel-joker {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--burdeos-claro);
  }
  .nivel-joker:hover {
    color: var(--burdeos-vivo);
    text-shadow: 0 0 10px rgba(195, 48, 85, 0.65);
  }
  .nivel-joker[aria-pressed="true"] {
    background: linear-gradient(145deg, var(--burdeos-vivo), var(--burdeos));
    color: #fff;
    box-shadow: 0 0 16px rgba(195, 48, 85, 0.55);
  }

  /* ---------- Modo J0KER: la sala se enciende ---------- */

  /* Cortina de luz burdeos en la parte de arriba de la ventana */
  .resplandor {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 46vh;
    pointer-events: none;
    z-index: 0;
    opacity: 0;
    transition: opacity 1.1s ease;
    background: linear-gradient(
      to bottom,
      rgba(195, 48, 85, 0.40) 0%,
      rgba(168, 40, 74, 0.22) 30%,
      rgba(125, 24, 50, 0.09) 60%,
      transparent 100%
    );
  }
  body.modo-joker .resplandor { opacity: 1; }

  /* Todo el fondo sube de intensidad */
  body {
    transition: background-color 1.1s ease, background-image 1.1s ease;
  }
  body.modo-joker {
    background-color: #140a0e;
    background-image:
      radial-gradient(ellipse 95% 60% at 50% -10%, rgba(195, 48, 85, 0.50), transparent 72%),
      radial-gradient(ellipse 70% 45% at 50% 110%, rgba(125, 24, 50, 0.22), transparent 72%);
  }
  body.modo-joker .app { color: #fdf3f5; }
  body.modo-joker header { border-bottom-color: rgba(195, 48, 85, 0.45); }
  body.modo-joker .barra { border-top-color: rgba(195, 48, 85, 0.35); }
  body.modo-joker .campo { border-color: rgba(195, 48, 85, 0.5); }
  body.modo-joker .msg.joker { border-left-color: var(--burdeos-vivo); }
  body.modo-joker .mascota {
    filter: invert(19%) sepia(64%) saturate(2800%) hue-rotate(325deg) brightness(112%) contrast(96%)
            drop-shadow(0 0 22px rgba(195, 48, 85, 0.8));
  }
  body.modo-joker h1 { filter: drop-shadow(0 0 18px rgba(195, 48, 85, 0.5)); }

  /* Los palos también se avivan */
  body.modo-joker .palo.negro { color: #c4aeb5; opacity: 0.5; }
  body.modo-joker .palo.rojo  { color: var(--burdeos-vivo); opacity: 0.72; }

  /* Temblor: se aplica al contenedor, no a la pista, para no pelearse
     con el transform que mantiene la posición congelada de los palos. */
  .palos.temblando { animation: temblor 0.55s ease-in-out; }

  @keyframes temblor {
    0%,100% { transform: translate(0, 0)    rotate(0deg); }
    12%     { transform: translate(-4px, 1px)  rotate(-0.7deg); }
    24%     { transform: translate(4px, -1px)  rotate(0.7deg); }
    36%     { transform: translate(-3px, 2px)  rotate(-0.5deg); }
    48%     { transform: translate(3px, -2px)  rotate(0.5deg); }
    62%     { transform: translate(-2px, 1px)  rotate(-0.3deg); }
    76%     { transform: translate(2px, -1px)  rotate(0.3deg); }
    88%     { transform: translate(-1px, 0)    rotate(-0.15deg); }
  }

  @media (max-width: 620px) {
    h1 { font-size: 1.9rem; }
    .slogan { font-size: 0.78rem; }
    .msg { max-width: 88%; }
    .mascota-caja { width: 46px; height: 62px; }
    header { gap: 14px; padding-top: 20px; }
    .btn-nueva { padding: 7px 10px; font-size: 0.75rem; }
    .potencia { gap: 6px; }
    .potencia-titulo { display: none; }
    .nivel { padding: 5px 9px; font-size: 0.68rem; }
  }
</style>
</head>
<body>

<!-- Cortina de luz burdeos en la parte superior. Solo se ve en modo J0KER. -->
<div class="resplandor" aria-hidden="true"></div>

<!-- Los carruseles de palos son de toda la web, no solo del chat: viven en _palos.html -->
{% include '_palos.html' %}

<div class="app">

  <header>
    <div class="mascota-caja">
      <img src="/mascota" alt="" class="mascota" id="mascota"
           onerror="this.style.display='none'; document.getElementById('fallback').style.display='block';">
      <div class="mascota-fallback" id="fallback">🃏</div>
    </div>
    <div class="titulos">
      <h1>JOKER</h1>
      <div class="slogan">Last Card</div>
    </div>
    <!-- Las salas y "Nueva partida" van juntas a la derecha: si se separan,
         la cabecera parte en dos líneas en cuanto la ventana se estrecha. -->
    <div class="acciones-cabecera">
      {% with sala='chat' %}{% include '_salas.html' %}{% endwith %}
      <button class="btn-nueva" id="btn-nueva" title="Empezar una conversación nueva">
        Nueva partida
      </button>
    </div>
  </header>

  <div id="chat">
    <div class="bienvenida" id="bienvenida">
      Soy <strong>JOKER</strong>. ¿Con que empezamos?
      <div class="ejemplos">
        <button class="ejemplo">¿Qué ha pasado hoy en España?</button>
        <button class="ejemplo">¿A cuánto está el IBEX?</button>
        <button class="ejemplo">¿Qué hora es en Tokio?</button>
        <button class="ejemplo">Apúntame que el lunes toca ITV</button>
        <button class="ejemplo">¿Cuánto son 250 dólares en euros?</button>
        <button class="ejemplo">Busca información sobre Nikola Tesla</button>
      </div>
    </div>
  </div>

  <div class="barra">
    <div class="campo">
      <textarea id="entrada" rows="1" placeholder="Escribe tu mensaje..." autofocus></textarea>
      <!-- El micrófono usa el reconocimiento de voz del propio navegador: no
           manda tu voz a ningún servidor nuestro ni cuesta nada. Si el
           navegador no lo trae (Firefox, por ejemplo), el botón lo dice. -->
      <button class="microfono" id="microfono" type="button"
              title="Hablar con JOKER"
              aria-label="Dictar un mensaje con la voz">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>
          <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
        </svg>
        <span class="globito-mic" id="globito-mic" role="status"></span>
      </button>
      <button class="enviar" id="enviar" title="Enviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="pie">Pulsa Enter para enviar &middot; Mayús+Enter para salto de línea</div>

    <!-- Selector de potencia. De momento solo cambia el aspecto; cuando quieras
         que afecte de verdad (memoria, modelo...), el nivel elegido está en la
         variable `nivelActual` del script y basta con mandarlo a /api/chat. -->
    <div class="potencia">
      <!-- Que JOKER conteste en voz alta. Usa la voz del sistema, así que no
           cuesta nada y funciona sin internet. -->
      <button class="voz" id="voz" type="button" aria-pressed="false"
              title="Que JOKER lea sus respuestas en voz alta">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="icono-voz">
          <path d="M3 9v6h4l5 5V4L7 9H3z"/>
          <path class="onda1" d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>
          <path class="onda2" d="M14 2.2v2.1c3.4.9 6 4 6 7.7s-2.6 6.8-6 7.7v2.1c4.6-.9 8-5 8-9.8s-3.4-8.9-8-9.8z"/>
        </svg>
        <span id="voz-texto">Voz</span>
      </button>
      <span class="potencia-titulo">Potencia</span>
      <div class="potencia-opciones" id="potencia" role="group" aria-label="Nivel de potencia">
        <button class="nivel" data-nivel="bajo"  aria-pressed="false">Bajo</button>
        <button class="nivel" data-nivel="medio" aria-pressed="true">Medio</button>
        <button class="nivel" data-nivel="alto"  aria-pressed="false">Alto</button>
        <button class="nivel" data-nivel="extra" aria-pressed="false">Extra</button>
        <button class="nivel nivel-joker" data-nivel="joker" aria-pressed="false">J0KER</button>
      </div>
    </div>
  </div>

</div>

<script>
  // ---------- Selector de potencia ----------
  const CLAVE_NIVEL = 'joker-nivel';
  const DUR_NORMAL  = 42;   // segundos que tarda una vuelta completa, ritmo normal
  const DUR_LENTA   = 90;   // en modo J0KER van más despacio, más solemne
  const MS_TEMBLOR  = 550;  // debe coincidir con la duración de @keyframes temblor

  let nivelActual = 'medio';
  let tokenTransicion = 0;  // evita que un cambio viejo pise a uno nuevo

  const sinAnimaciones = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function posicionY(el) {
    return new DOMMatrixReadOnly(getComputedStyle(el).transform).m42;
  }

  // Arranca una animación en la fase que corresponde a la posición actual de
  // la pista. Es el truco que hace que al cambiar de sentido los palos sigan
  // desde donde estaban, en vez de saltar de golpe al principio.
  function animarPista(pista, nombre, duracion) {
    const alturaMedia = pista.getBoundingClientRect().height / 2;
    let avance = 0;

    if (alturaMedia > 0) {
      const y = posicionY(pista);
      // "subir" recorre de 0 a -50%; "bajar" recorre de -50% a 0
      avance = nombre === 'subir' ? -y / alturaMedia : y / alturaMedia + 1;
      avance = ((avance % 1) + 1) % 1;   // lo deja dentro de [0, 1)
    }

    pista.style.animation = 'none';
    void pista.offsetWidth;              // fuerza al navegador a reiniciarla
    pista.style.transform = '';
    pista.style.animation = nombre + ' ' + duracion + 's linear infinite';
    pista.style.animationDelay = '-' + (avance * duracion).toFixed(3) + 's';
  }

  function congelarPista(pista) {
    const y = posicionY(pista);
    pista.style.animation = 'none';
    pista.style.transform = 'translateY(' + y + 'px)';
  }

  // En modo J0KER los palos dejan de ir cada uno por su lado: se paran,
  // tiemblan, y luego suben los dos juntos y despacio.
  function aplicarModoJoker(activar, conTemblor) {
    document.body.classList.toggle('modo-joker', activar);

    const contenedores = [...document.querySelectorAll('.palos')];
    const pistas = contenedores.map(c => c.querySelector('.palos-pista'));
    if (!pistas.length || sinAnimaciones) return;

    const token = ++tokenTransicion;   // cualquier transición pendiente queda anulada
    contenedores.forEach(c => c.classList.remove('temblando'));

    if (!activar) {
      // Volver a lo de siempre: la izquierda baja, la derecha sube.
      contenedores.forEach(c => {
        const pista = c.querySelector('.palos-pista');
        animarPista(pista, c.classList.contains('izquierda') ? 'bajar' : 'subir', DUR_NORMAL);
      });
      return;
    }

    if (!conTemblor) {
      pistas.forEach(p => animarPista(p, 'subir', DUR_LENTA));
      return;
    }

    // 1. Se paran en seco justo donde estén
    pistas.forEach(congelarPista);

    // 2. Tiemblan (la animación va en el contenedor, no en la pista, para no
    //    pelearse con el transform que mantiene la posición congelada)
    contenedores.forEach(c => {
      void c.offsetWidth;
      c.classList.add('temblando');
    });

    // 3. Pasado el temblor, los dos arrancan hacia arriba
    setTimeout(() => {
      if (token !== tokenTransicion) return;   // llegó otro cambio por el camino
      contenedores.forEach(c => c.classList.remove('temblando'));
      pistas.forEach(p => animarPista(p, 'subir', DUR_LENTA));
    }, MS_TEMBLOR);
  }

  function elegirNivel(nivel, conTemblor) {
    const botones = [...document.querySelectorAll('.nivel')];
    const boton = botones.find(b => b.dataset.nivel === nivel);
    if (!boton) return;

    const eraJoker = nivelActual === 'joker';
    const esJoker = nivel === 'joker';
    nivelActual = nivel;

    botones.forEach(b => b.setAttribute('aria-pressed', String(b === boton)));

    try {
      localStorage.setItem(CLAVE_NIVEL, nivel);
    } catch (e) { /* ventana privada: no pasa nada, simplemente no se recuerda */ }

    if (esJoker !== eraJoker) aplicarModoJoker(esJoker, conTemblor);
  }

  document.getElementById('potencia').addEventListener('click', (e) => {
    const boton = e.target.closest('.nivel');
    if (boton) elegirNivel(boton.dataset.nivel, true);
  });

  // Recuperar el nivel de la última visita (sin temblor: al abrir la página
  // no tiene sentido que tiemble sola)
  (function recuperarNivel() {
    let guardado = null;
    try { guardado = localStorage.getItem(CLAVE_NIVEL); } catch (e) { /* sin acceso */ }
    if (guardado && guardado !== 'medio') elegirNivel(guardado, false);
  })();

  const chat       = document.getElementById('chat');
  const entrada    = document.getElementById('entrada');
  const btnEnviar  = document.getElementById('enviar');
  const btnNueva   = document.getElementById('btn-nueva');
  let ocupado = false;

  // La caja de texto crece según escribes
  entrada.addEventListener('input', () => {
    entrada.style.height = 'auto';
    entrada.style.height = Math.min(entrada.scrollHeight, 160) + 'px';
  });

  entrada.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviar();
    }
  });

  btnEnviar.addEventListener('click', enviar);

  // ====================================================================
  // HABLARLE A JOKER
  // ====================================================================
  // El reconocimiento de voz lo hace el propio navegador (SpeechRecognition).
  // No pasa por nuestro servidor, no cuesta nada y no necesita clave. A
  // cambio, no todos los navegadores lo traen: Chrome y Edge sí, Firefox no.
  // Si no está, el botón se apaga y lo dice, en vez de no hacer nada.

  const btnMic = document.getElementById('microfono');
  const globitoMic = document.getElementById('globito-mic');
  const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;

  let oyente = null;
  let escuchando = false;
  let avisoMic = null;

  function decirMic(texto, milis) {
    globitoMic.textContent = texto;
    btnMic.classList.add('avisando');
    clearTimeout(avisoMic);
    avisoMic = setTimeout(() => btnMic.classList.remove('avisando'), milis || 3200);
  }

  function pararDeEscuchar() {
    escuchando = false;
    btnMic.classList.remove('escuchando');
    btnMic.title = 'Hablar con JOKER';
  }

  if (!Reconocimiento) {
    btnMic.classList.add('no-puede');
    btnMic.title = 'Tu navegador no sabe escuchar';
    btnMic.addEventListener('click', () => decirMic(
      'Tu navegador no trae reconocimiento de voz. En Chrome o Edge sí funciona.', 4200));
  } else {
    oyente = new Reconocimiento();
    oyente.lang = 'es-ES';
    oyente.continuous = false;
    oyente.interimResults = true;   // va escribiendo mientras hablas

    let yaEscrito = '';

    oyente.addEventListener('start', () => {
      escuchando = true;
      yaEscrito = entrada.value ? entrada.value.trimEnd() + ' ' : '';
      btnMic.classList.add('escuchando');
      btnMic.title = 'Pulsa para dejar de escuchar';
      decirMic('Te escucho. Habla, y pulsa otra vez para parar.', 2600);
    });

    oyente.addEventListener('result', (e) => {
      let texto = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        texto += e.results[i][0].transcript;
      }
      entrada.value = yaEscrito + texto;
      entrada.dispatchEvent(new Event('input'));   // que la caja crezca sola
    });

    oyente.addEventListener('error', (e) => {
      pararDeEscuchar();
      const motivos = {
        'not-allowed': 'No me has dado permiso para el micrófono. Está en el '
                     + 'candado de la barra de direcciones.',
        'service-not-allowed': 'El navegador no me deja usar el micrófono aquí.',
        'no-speech': 'No te he oído. Prueba otra vez.',
        'audio-capture': 'No encuentro ningún micrófono conectado.',
        'network': 'El reconocimiento de voz necesita internet y no lo tengo.',
      };
      decirMic(motivos[e.error] || `No he podido escuchar (${e.error}).`, 4600);
    });

    oyente.addEventListener('end', () => {
      pararDeEscuchar();
      entrada.focus();
    });

    btnMic.addEventListener('click', () => {
      if (escuchando) { oyente.stop(); return; }
      try {
        oyente.start();
      } catch (e) {
        // start() protesta si ya estaba arrancando; no es un fallo real
        pararDeEscuchar();
      }
    });
  }

  // ====================================================================
  // QUE JOKER CONTESTE EN VOZ ALTA
  // ====================================================================
  // La voz también es del sistema (speechSynthesis): gratis, sin internet y
  // sin mandar el texto a ningún sitio. Se recuerda si lo dejaste encendido.

  const CLAVE_VOZ = 'joker-voz';
  const btnVoz = document.getElementById('voz');
  const hayVoz = 'speechSynthesis' in window;
  let vozActiva = false;

  function vozEspanola() {
    const voces = window.speechSynthesis.getVoices();
    return voces.find(v => v.lang === 'es-ES')
        || voces.find(v => v.lang && v.lang.startsWith('es'))
        || null;
  }

  function leerEnVoz(texto) {
    if (!vozActiva || !hayVoz || !texto) return;
    window.speechSynthesis.cancel();

    // Los bloques de código no se leen: escuchar llaves y paréntesis uno a uno
    // no le sirve a nadie.
    const limpio = texto
      .replace(/```[\s\S]*?```/g, ' (aquí va un trozo de código) ')
      .replace(/[*_`#>]/g, '')
      .trim();
    if (!limpio) return;

    const frase = new SpeechSynthesisUtterance(limpio);
    const voz = vozEspanola();
    if (voz) frase.voice = voz;
    frase.lang = 'es-ES';
    frase.rate = 1.03;
    frase.addEventListener('start', () => btnVoz.classList.add('hablando'));
    frase.addEventListener('end', () => btnVoz.classList.remove('hablando'));
    frase.addEventListener('error', () => btnVoz.classList.remove('hablando'));
    window.speechSynthesis.speak(frase);
  }

  function ponerVoz(activa) {
    vozActiva = activa;
    btnVoz.setAttribute('aria-pressed', activa ? 'true' : 'false');
    document.getElementById('voz-texto').textContent = activa ? 'Voz' : 'Voz';
    btnVoz.title = activa
      ? 'JOKER lee sus respuestas. Pulsa para callarlo.'
      : 'Que JOKER lea sus respuestas en voz alta';
    if (!activa && hayVoz) {
      window.speechSynthesis.cancel();
      btnVoz.classList.remove('hablando');
    }
    try { localStorage.setItem(CLAVE_VOZ, activa ? '1' : '0'); } catch (e) {}
  }

  if (!hayVoz) {
    btnVoz.classList.add('no-puede');
  } else {
    btnVoz.addEventListener('click', () => ponerVoz(!vozActiva));
    try { ponerVoz(localStorage.getItem(CLAVE_VOZ) === '1'); } catch (e) { ponerVoz(false); }
    // Algunos navegadores tardan en tener la lista de voces
    window.speechSynthesis.addEventListener?.('voiceschanged', () => {});
  }

  document.querySelectorAll('.ejemplo').forEach(b => {
    b.addEventListener('click', () => {
      entrada.value = b.textContent.trim();
      enviar();
    });
  });

  btnNueva.addEventListener('click', async () => {
    if (ocupado) return;
    await fetch('/api/nueva', { method: 'POST' });
    chat.innerHTML = '';
    añadirBienvenida();
  });

  function añadirBienvenida() {
    const div = document.createElement('div');
    div.className = 'bienvenida';
    div.innerHTML = 'Soy <strong>JOKER</strong>. Puedo decirte la hora y el tiempo de ' +
                    'cualquier lugar, resolver cálculos y buscar información.';
    chat.appendChild(div);
  }

  // Usamos textContent (no innerHTML) para el texto de los mensajes: así, si
  // alguien escribe algo que parezca HTML, se muestra como texto y no se ejecuta.
  function añadirMensaje(texto, tipo, autor) {
    const bienvenida = document.getElementById('bienvenida');
    if (bienvenida) bienvenida.remove();
    document.querySelectorAll('.bienvenida').forEach(b => b.remove());

    const div = document.createElement('div');
    div.className = 'msg ' + tipo;

    if (autor) {
      const etiqueta = document.createElement('span');
      etiqueta.className = 'autor';
      etiqueta.textContent = autor;
      div.appendChild(etiqueta);
    }

    const cuerpo = document.createElement('span');
    cuerpo.textContent = texto;
    div.appendChild(cuerpo);

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function mostrarPensando() {
    const div = document.createElement('div');
    div.className = 'msg joker';
    div.id = 'pensando';
    div.innerHTML = '<span class="autor">JOKER</span>' +
                    '<div class="pensando"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function quitarPensando() {
    const p = document.getElementById('pensando');
    if (p) p.remove();
  }

  async function enviar() {
    const mensaje = entrada.value.trim();
    if (!mensaje || ocupado) return;

    ocupado = true;
    btnEnviar.disabled = true;
    entrada.value = '';
    entrada.style.height = 'auto';

    añadirMensaje(mensaje, 'usuario', 'TÚ');
    mostrarPensando();

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje })
      });
      const datos = await resp.json();
      quitarPensando();

      if (datos.error) {
        añadirMensaje(datos.error, 'error', null);
      } else {
        añadirMensaje(datos.respuesta, 'joker', 'JOKER');
        leerEnVoz(datos.respuesta);   // solo si has encendido la voz
      }
    } catch (e) {
      quitarPensando();
      añadirMensaje('No pude contactar con el servidor. ¿Sigue abierta la ventana ' +
                    'donde ejecutaste "python app.py"?', 'error', null);
    } finally {
      ocupado = false;
      btnEnviar.disabled = false;
      entrada.focus();
    }
  }
</script>
</body>
</html>
