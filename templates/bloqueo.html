<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/joker.css">
<style>
  /* La puerta de la casa. Nada más: ni menú, ni salas, ni pistas de lo que
     hay dentro. Quien llegue aquí sin el PIN no debería ni saber si tienes
     cartera de inversiones. */
  body { display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 20px; }

  .puerta {
    width: 100%; max-width: 380px; text-align: center;
    position: relative; z-index: 1;
  }
  .carta {
    font-size: 3.4rem; line-height: 1; margin-bottom: 4px;
    filter: drop-shadow(0 4px 20px rgba(195, 48, 85, 0.5));
    animation: respirar 4s ease-in-out infinite;
  }
  @keyframes respirar {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-7px) rotate(3deg); }
  }
  h1 { font-size: 1.9rem; margin-bottom: 22px; }

  .caja {
    background: var(--negro-carta); border: 1px solid var(--borde);
    border-radius: 14px; padding: 26px 24px;
  }
  .caja label { text-align: left; }
  input[type=password] { text-align: center; letter-spacing: 0.4em;
    font-size: 1.15rem; padding: 13px 12px; }
  .boton { width: 100%; margin-top: 14px; }

  .pie { font-size: 0.73rem; color: #5d4c51; line-height: 1.6; margin-top: 18px; }

  /* El zarandeo del PIN equivocado: se entiende antes que el texto */
  .caja.mal { animation: negar 0.42s ease; }
  @keyframes negar {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-9px); }
    40%      { transform: translateX(8px); }
    60%      { transform: translateX(-5px); }
    80%      { transform: translateX(3px); }
  }
</style>
</head>
<body>

<div class="halo" aria-hidden="true"
     style="position:fixed;left:0;right:0;top:0;height:60vh;pointer-events:none;
            background:radial-gradient(ellipse 80% 62% at 50% 0%, var(--fondo-halo), transparent 72%)"></div>

<div class="puerta">
  <div class="carta" aria-hidden="true">&#127183;</div>
  <h1>JOKER</h1>

  <div class="caja" id="caja">
    <label for="pin">Escribe tu PIN</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off"
           autofocus placeholder="••••">
    <div id="error"></div>
    <button class="boton" id="entrar">Entrar</button>
  </div>

  <div class="pie">
    El PIN tapa la web. Tu cartera de inversiones va además cifrada aparte,
    con su propia contraseña.
  </div>
</div>

<script>
  const pin = document.getElementById('pin');
  const boton = document.getElementById('entrar');
  const caja = document.getElementById('caja');
  const error = document.getElementById('error');

  async function entrar() {
    error.innerHTML = '';
    if (!pin.value) { pin.focus(); return; }

    boton.disabled = true;
    boton.textContent = 'Un momento…';
    try {
      const r = await fetch('/api/acceso/entrar', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pin: pin.value}),
      });
      const datos = await r.json();
      if (datos.ok) { window.location.href = '/mesa'; return; }

      const d = document.createElement('div');
      d.className = 'error';
      d.textContent = datos.error || 'Ese PIN no es el bueno.';
      error.appendChild(d);
      caja.classList.remove('mal');
      void caja.offsetWidth;
      caja.classList.add('mal');
      pin.value = '';
      pin.focus();
    } finally {
      boton.disabled = false;
      boton.textContent = 'Entrar';
    }
  }

  boton.addEventListener('click', entrar);
  pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
</script>
</body>
</html>
